<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="titulo-tag">Produto | Achadinhos Super Espiã</title>
<meta name="description" id="desc-tag" content="">
<link rel="icon" type="image/jpeg" href="/images/logo-achadinhos.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600" rel="stylesheet">
<style>
  :root{ --azul:#1B3A6B; --dourado:#8D6A2A; --rosa:#FF3E8E; --verde:#16803D; --bg:#EBEBEB; --card-bg:#FFFFFF; --text:#1F2430; --text-muted:#6B7280; --border:#ECECEC; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.6; }
  h1{ font-family:'Poppins',sans-serif; color:var(--text); font-size:20px; font-weight:600; margin:0; }
  a{ color:inherit; text-decoration:none; }
  .convite-grupo{ font-size:13px; color:var(--text-muted); font-weight:600; }
  .btns-grupo-topo{ display:flex; gap:8px; flex-wrap:wrap; }
  .btns-grupo-topo a{ display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:700; white-space:nowrap; }
  .btns-grupo-topo a.wa{ background:#00E676; color:#08321C; }
  .btns-grupo-topo a.tg{ background:#2FA9FF; color:#08213D; }
  .btns-grupo-topo img{ width:15px; height:15px; }

  nav{ background:#fff; border-bottom:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  nav a.home{ font-weight:700; color:var(--azul); font-size:14px; }

  main{ max-width:1100px; margin:0 auto; padding:24px 16px 80px; width:100%; box-sizing:border-box; }

  .caixa{ background:var(--card-bg); border-radius:10px; width:100%; }

  /* Grid com áreas nomeadas: no celular vira 1 coluna na ordem título > foto > info > descrição;
     no computador vira o layout de 3 colunas estilo Mercado Livre */
  .produto-grid{
    display:grid;
    gap:16px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
      "titulo"
      "foto"
      "info"
      "descricao";
    width:100%;
  }
  .area-titulo{ grid-area:titulo; padding:4px 4px 0; }
  .area-mini{ grid-area:mini; display:none; }
  .area-foto{ grid-area:foto; }
  .area-info{ grid-area:info; }
  .area-descricao{ grid-area:descricao; }

  .miniaturas{ display:flex; flex-direction:column; gap:10px; max-height:520px; overflow-y:auto; padding:2px; }
  .miniaturas img{ width:100%; aspect-ratio:1/1; object-fit:contain; background:#fff; border:2px solid var(--border); border-radius:8px; cursor:pointer; padding:4px; }
  .miniaturas img.ativa{ border-color:var(--azul); }

  /* Imagem principal com zoom tipo lupa (desktop) + clique/arraste pra navegar (celular) */
  .imagem-principal{ position:relative; padding:20px; }
  .imagem-principal .foto-wrap{ position:relative; aspect-ratio:1/1; overflow:hidden; border-radius:8px; cursor:zoom-in; touch-action:pan-y; }
  .imagem-principal img{ width:100%; height:100%; object-fit:contain; display:block; }
  .lupa-zoom{ position:absolute; top:0; left:0; width:100%; height:100%; background-repeat:no-repeat; opacity:0; pointer-events:none; transition:opacity .15s ease; }
  .foto-wrap.zoom-ativo .lupa-zoom{ opacity:1; }
  .foto-wrap.zoom-ativo img{ opacity:0; }
  .dica-zoom{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:10px; }

  /* Bolinhas indicadoras (só aparecem no celular) */
  .dots-foto{ display:none; justify-content:center; gap:6px; margin-top:12px; }
  .dots-foto .dot{ width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; }
  .dots-foto .dot.ativo{ background:var(--azul); width:18px; border-radius:4px; transition:width .2s ease; }

  .estrelas{ color:var(--dourado); }
  .num-avaliacoes{ color:var(--text-muted); font-size:13px; }
  .preco{ font-family:'Poppins',sans-serif; font-weight:800; color:var(--text); font-size:34px; margin:10px 0 4px; }
  .desc-titulo{ font-weight:700; font-size:16px; margin:0 0 8px; }
  .desc{ font-size:15px; color:#333; white-space:pre-line; }
  .pagamento{ font-size:14px; color:var(--text-muted); margin-top:6px; }
  .btn-comprar{ display:block; text-align:center; background:var(--verde); color:#fff; font-weight:700; font-size:16px; padding:16px 28px; border-radius:10px; border:none; cursor:pointer; margin-top:16px; width:100%; }
  .btn-comprar:hover{ filter:brightness(1.08); }
  .selo-confianca{ display:flex; flex-direction:column; gap:8px; margin-top:16px; font-size:13px; color:var(--text-muted); border-top:1px solid var(--border); padding-top:14px; }

  .area-foto, .area-info, .area-descricao, .area-titulo{ padding:20px; }
  .area-titulo{ padding-bottom:0; }

  /* Lightbox: foto ampliada com setas */
  .lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:999; display:none; align-items:center; justify-content:center; }
  .lightbox.aberto{ display:flex; }
  .lightbox img{ max-width:88vw; max-height:85vh; object-fit:contain; }
  .lightbox-fechar{ position:absolute; top:18px; right:24px; background:none; border:none; color:#fff; font-size:32px; cursor:pointer; line-height:1; }
  .lightbox-seta{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.15); border:none; color:#fff; font-size:28px; width:52px; height:52px; border-radius:50%; cursor:pointer; }
  .lightbox-seta:hover{ background:rgba(255,255,255,.3); }
  .lightbox-seta.esquerda{ left:18px; }
  .lightbox-seta.direita{ right:18px; }
  .lightbox-contador{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); color:#fff; font-size:13px; opacity:.8; }

  /* Celular: mostra as bolinhas, esconde miniaturas e zoom por mouse, e reduz espaçamento lateral */
  @media (max-width: 860px) {
    .dots-foto{ display:flex; }
    .imagem-principal .foto-wrap{ cursor:default; }
    .foto-wrap.zoom-ativo .lupa-zoom{ opacity:0; }
    .foto-wrap.zoom-ativo img{ opacity:1; }
    .dica-zoom{ display:none; }
    .preco{ font-size:28px; }
    .lightbox-seta{ width:42px; height:42px; font-size:22px; }
    main{ padding:12px 10px 60px; }
    .produto-grid{ gap:10px; }
    .area-titulo, .area-foto, .area-info, .area-descricao{ padding:14px; }
  }

  /* Computador: layout de 3 colunas, título dentro da coluna da direita */
  @media (min-width: 861px) {
    .produto-grid{
      grid-template-columns: 88px minmax(0,1fr) 360px;
      grid-template-areas:
        "mini foto titulo"
        "mini foto info"
        "descricao descricao descricao";
    }
    .area-mini{ display:flex; }
    .area-titulo{ padding-bottom:0; align-self:end; }
    .area-titulo h1{ margin-bottom:4px; }
  }
</style>
</head>
<body>

<nav>
  <a class="home" href="/">🏠 Página Principal</a>
  <span class="convite-grupo">Entre no Grupo Achadinhos de Ofertas e Cupons</span>
  <span class="btns-grupo-topo">
    <a class="wa" href="/whatsapp"><img src="/images/icones/icone-whatsapp.png" alt=""> Grupo WhatsApp</a>
    <a class="tg" href="/telegram"><img src="/images/icones/icone-telegram.png" alt=""> Grupo Telegram</a>
  </span>
</nav>

<main id="conteudo">Carregando...</main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-fechar" onclick="fecharLightbox()" aria-label="Fechar">✕</button>
  <button class="lightbox-seta esquerda" onclick="navegarLightbox(-1)" aria-label="Foto anterior">‹</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-seta direita" onclick="navegarLightbox(1)" aria-label="Próxima foto">›</button>
  <div class="lightbox-contador" id="lightbox-contador"></div>
</div>

<script src="/js/loja.js?v=3"></script>
<script>
  const slug = window.location.pathname.split("/").filter(Boolean).pop();
  let FOTOS_PRODUTO = [];
  let INDICE_ATUAL = 0;

  function montarZoom(fotoUrl) {
    const box = document.getElementById("foto-wrap");
    const lupa = document.getElementById("lupa-zoom");
    if (!box || !lupa) return;
    lupa.style.backgroundImage = `url('${fotoUrl}')`;
    lupa.style.backgroundSize = "220%";

    box.onmousemove = (e) => {
      const rect = box.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      lupa.style.backgroundPosition = `${x}% ${y}%`;
      box.classList.add("zoom-ativo");
    };
    box.onmouseleave = () => box.classList.remove("zoom-ativo");
  }

  function montarSwipe() {
    const box = document.getElementById("foto-wrap");
    if (!box) return;
    let xInicial = null;

    box.addEventListener("touchstart", (e) => {
      xInicial = e.touches[0].clientX;
    }, { passive: true });

    box.addEventListener("touchend", (e) => {
      if (xInicial === null) return;
      const xFinal = e.changedTouches[0].clientX;
      const delta = xFinal - xInicial;
      if (Math.abs(delta) > 40) {
        delta < 0 ? navegarFotoPrincipal(1) : navegarFotoPrincipal(-1);
      }
      xInicial = null;
    });
  }

  function navegarFotoPrincipal(direcao) {
    const novoIndice = (INDICE_ATUAL + direcao + FOTOS_PRODUTO.length) % FOTOS_PRODUTO.length;
    trocarFotoPrincipal(novoIndice);
  }

  function trocarFotoPrincipal(indice) {
    INDICE_ATUAL = indice;
    const fotoUrl = FOTOS_PRODUTO[indice];
    document.getElementById("foto-principal").src = fotoUrl;
    document.querySelectorAll(".miniaturas img").forEach((img, i) => {
      img.classList.toggle("ativa", i === indice);
    });
    document.querySelectorAll(".dots-foto .dot").forEach((dot, i) => {
      dot.classList.toggle("ativo", i === indice);
    });
    montarZoom(fotoUrl);
  }

  function abrirLightbox(indice) {
    INDICE_ATUAL = indice;
    atualizarLightbox();
    document.getElementById("lightbox").classList.add("aberto");
  }
  function fecharLightbox() {
    document.getElementById("lightbox").classList.remove("aberto");
  }
  function navegarLightbox(direcao) {
    INDICE_ATUAL = (INDICE_ATUAL + direcao + FOTOS_PRODUTO.length) % FOTOS_PRODUTO.length;
    atualizarLightbox();
  }
  function atualizarLightbox() {
    document.getElementById("lightbox-img").src = FOTOS_PRODUTO[INDICE_ATUAL];
    document.getElementById("lightbox-contador").textContent = `${INDICE_ATUAL + 1} / ${FOTOS_PRODUTO.length}`;
  }
  document.addEventListener("keydown", (e) => {
    if (!document.getElementById("lightbox").classList.contains("aberto")) return;
    if (e.key === "Escape") fecharLightbox();
    if (e.key === "ArrowLeft") navegarLightbox(-1);
    if (e.key === "ArrowRight") navegarLightbox(1);
  });

  async function iniciar(){
    const produtos = await carregarProdutos();
    const p = produtos.find(x => x.slug === slug);
    const cont = document.getElementById("conteudo");
    if (!p) { cont.innerHTML = "<h1>Produto não encontrado</h1>"; return; }

    document.title = p.title + " — Menor Preço com Cupom | Achadinhos Super Espiã";
    document.getElementById("titulo-tag").textContent = p.title + " — Menor Preço com Cupom | Achadinhos Super Espiã";
    document.getElementById("desc-tag").setAttribute("content", (p.descricao ? p.descricao.slice(0, 155) : `Compre ${p.title} com cupom de desconto e o menor preço. Oferta verificada pela Achadinhos Super Espiã.`));

    FOTOS_PRODUTO = (p.fotos && p.fotos.length) ? p.fotos.map(f => typeof f === "string" ? f : f.foto) : ["/images/logo-achadinhos.jpg"];
    const fotoInicial = FOTOS_PRODUTO[0];

    const miniaturasHTML = FOTOS_PRODUTO.map((foto, i) =>
      `<img src="${foto}" class="${i === 0 ? 'ativa' : ''}" alt="${p.title} - foto ${i + 1}" onclick="trocarFotoPrincipal(${i})">`
    ).join("");

    const dotsHTML = FOTOS_PRODUTO.length > 1
      ? `<div class="dots-foto">${FOTOS_PRODUTO.map((_, i) => `<span class="dot ${i === 0 ? 'ativo' : ''}" onclick="trocarFotoPrincipal(${i})" aria-label="Foto ${i + 1} de ${FOTOS_PRODUTO.length}"></span>`).join("")}</div>`
      : "";

    const estrelas = p.nota ? `<div><span class="estrelas">★★★★★</span> <span class="num-avaliacoes">${p.nota}${p.avaliacoes ? " (" + p.avaliacoes + " avaliações)" : ""}${p.vendidos ? " · " + p.vendidos + " vendidos" : ""}</span></div>` : "";

    cont.innerHTML = `
      <div class="produto-grid">
        <div class="area-titulo"><h1>${p.title}</h1></div>

        <div class="area-mini miniaturas caixa">${miniaturasHTML}</div>

        <div class="area-foto imagem-principal caixa">
          <div class="foto-wrap" id="foto-wrap" onclick="abrirLightbox(INDICE_ATUAL)">
            <img id="foto-principal" src="${fotoInicial}" alt="${p.title}">
            <div class="lupa-zoom" id="lupa-zoom"></div>
          </div>
          ${dotsHTML}
          <div class="dica-zoom">🔍 Passe o mouse pra dar zoom · clique pra ampliar</div>
        </div>

        <div class="area-info caixa">
          ${estrelas}
          ${p.preco ? `<div class="preco">R$ ${p.preco}</div>` : ""}
          ${p.pagamento ? `<div class="pagamento">💳 ${p.pagamento}</div>` : ""}
          <button class="btn-comprar" onclick="irComCarregando('${(p.link || "").replace(/'/g, "\\'")}')">Comprar agora</button>
          <div class="selo-confianca">
            <span>✅ Oferta verificada</span>
            <span>🚚 Envio pela loja parceira</span>
          </div>
        </div>

        ${p.descricao ? `
        <div class="area-descricao caixa">
          <div class="desc-titulo">Descrição</div>
          <p class="desc">${p.descricao}</p>
        </div>` : ""}
      </div>
    `;

    montarZoom(fotoInicial);
    montarSwipe();
  }

  iniciar();
</script>

</body>
</html>
