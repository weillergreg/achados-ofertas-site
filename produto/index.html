<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="titulo-tag">Produto | Achadinhos Super Espiã</title>
<meta name="description" id="desc-tag" content="">
<link rel="icon" type="image/jpeg" href="/images/logo-achadinhos.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600" rel="stylesheet">
<style>
  :root{ --azul:#1B3A6B; --dourado:#8D6A2A; --rosa:#FF3E8E; --verde:#16803D; --bg:#FAFAFA; --card-bg:#FFFFFF; --text:#1F2430; --text-muted:#6B7280; --border:#ECECEC; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.6; }
  h1{ font-family:'Poppins',sans-serif; color:var(--azul); font-size:20px; font-weight:600; margin:0 0 10px; }
  a{ color:inherit; text-decoration:none; }
  nav{ background:#fff; border-bottom:1px solid var(--border); padding:14px 20px; }
  nav a.home{ font-weight:700; color:var(--azul); font-size:14px; }

  main{ max-width:1100px; margin:0 auto; padding:24px 20px 80px; }

  /* Layout estilo Mercado Livre: galeria à esquerda, informações à direita */
  .produto-grid{ display:grid; grid-template-columns: 90px 1fr; gap:16px; }
  .miniaturas{ display:flex; flex-direction:column; gap:10px; max-height:520px; overflow-y:auto; }
  .miniaturas img{ width:100%; aspect-ratio:1/1; object-fit:contain; background:#fff; border:2px solid var(--border); border-radius:8px; cursor:pointer; padding:4px; }
  .miniaturas img.ativa{ border-color:var(--azul); }

  /* Imagem principal com zoom tipo lupa (segue o mouse) */
  .imagem-principal{ position:relative; background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; aspect-ratio:1/1; cursor:zoom-in; }
  .imagem-principal img{ width:100%; height:100%; object-fit:contain; display:block; }
  .lupa-zoom{ position:absolute; top:0; left:0; width:100%; height:100%; background-repeat:no-repeat; opacity:0; pointer-events:none; transition:opacity .15s ease; }
  .imagem-principal.zoom-ativo .lupa-zoom{ opacity:1; }
  .imagem-principal.zoom-ativo img{ opacity:0; }

  .coluna-info{ display:flex; flex-direction:column; gap:10px; }
  .estrelas{ color:var(--dourado); }
  .num-avaliacoes{ color:var(--text-muted); font-size:13px; }
  .preco{ font-family:'Poppins',sans-serif; font-weight:800; color:var(--text); font-size:34px; margin:6px 0; }
  .preco-parcelas{ color:var(--verde); font-size:14px; font-weight:600; }
  .desc-titulo{ font-weight:700; font-size:16px; margin:20px 0 8px; }
  .desc{ font-size:15px; color:#333; white-space:pre-line; }
  .pagamento{ font-size:14px; color:var(--text-muted); margin-top:6px; }
  .btn-comprar{ display:block; text-align:center; background:var(--verde); color:#fff; font-weight:700; font-size:16px; padding:16px 28px; border-radius:10px; border:none; cursor:pointer; margin-top:14px; width:100%; }
  .btn-comprar:hover{ filter:brightness(1.08); }
  .selo-confianca{ display:flex; gap:10px; margin-top:16px; font-size:13px; color:var(--text-muted); flex-wrap:wrap; }
  .selo-confianca span{ display:flex; align-items:center; gap:6px; }

  /* Galeria em faixa horizontal no celular */
  @media (max-width: 720px) {
    .produto-grid{ grid-template-columns: 1fr; }
    .miniaturas{ flex-direction:row; overflow-x:auto; overflow-y:visible; max-height:none; order:2; }
    .miniaturas img{ width:64px; flex-shrink:0; }
    .imagem-principal{ order:1; cursor:default; }
    .imagem-principal.zoom-ativo .lupa-zoom{ opacity:0; }
    .imagem-principal.zoom-ativo img{ opacity:1; }
    .preco{ font-size:28px; }
  }
</style>
</head>
<body>

<nav><a class="home" href="/">🏠 Página Principal</a></nav>

<main id="conteudo">Carregando...</main>

<script src="/js/loja.js?v=3"></script>
<script>
  const slug = window.location.pathname.split("/").filter(Boolean).pop();

  function montarZoom(fotoUrl) {
    const box = document.getElementById("imagem-principal");
    const lupa = document.getElementById("lupa-zoom");
    if (!box || !lupa) return;
    lupa.style.backgroundImage = `url('${fotoUrl}')`;
    lupa.style.backgroundSize = "220%";

    box.onmousemove = (e) => {
      const rect = box.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      lupa.style.backgroundPosition = `${x}% ${y}%`;
      box.classList.add("zoom-ativo");
    };
    box.onmouseleave = () => box.classList.remove("zoom-ativo");
  }

  function trocarFotoPrincipal(fotoUrl) {
    document.getElementById("foto-principal").src = fotoUrl;
    document.querySelectorAll(".miniaturas img").forEach(img => {
      img.classList.toggle("ativa", img.dataset.foto === fotoUrl);
    });
    montarZoom(fotoUrl);
  }

  async function iniciar(){
    const produtos = await carregarProdutos();
    const p = produtos.find(x => x.slug === slug);
    const cont = document.getElementById("conteudo");
    if (!p) { cont.innerHTML = "<h1>Produto não encontrado</h1>"; return; }

    document.title = p.title + " | Achadinhos Super Espiã";
    document.getElementById("titulo-tag").textContent = p.title + " | Achadinhos Super Espiã";
    document.getElementById("desc-tag").setAttribute("content", p.descricao || "");

    const listaFotos = (p.fotos && p.fotos.length) ? p.fotos.map(f => f.foto) : ["/images/logo-achadinhos.jpg"];
    const fotoInicial = listaFotos[0];

    const miniaturasHTML = listaFotos.map((foto, i) =>
      `<img src="${foto}" data-foto="${foto}" class="${i === 0 ? 'ativa' : ''}" alt="${p.title} - foto ${i + 1}" onclick="trocarFotoPrincipal('${foto}')">`
    ).join("");

    const estrelas = p.nota ? `<div><span class="estrelas">★★★★★</span> <span class="num-avaliacoes">${p.nota}${p.avaliacoes ? " (" + p.avaliacoes + " avaliações)" : ""}${p.vendidos ? " · " + p.vendidos + " vendidos" : ""}</span></div>` : "";

    cont.innerHTML = `
      <div class="produto-grid">
        <div class="miniaturas">${miniaturasHTML}</div>
        <div class="imagem-principal" id="imagem-principal">
          <img id="foto-principal" src="${fotoInicial}" alt="${p.title}">
          <div class="lupa-zoom" id="lupa-zoom"></div>
        </div>
        <div class="coluna-info">
          <h1>${p.title}</h1>
          ${estrelas}
          ${p.preco ? `<div class="preco">R$ ${p.preco}</div>` : ""}
          ${p.pagamento ? `<div class="pagamento">💳 ${p.pagamento}</div>` : ""}
          <button class="btn-comprar" onclick="irComCarregando('${(p.link || "").replace(/'/g, "\\'")}')">Comprar agora</button>
          <div class="selo-confianca">
            <span>✅ Oferta verificada</span>
            <span>🚚 Envio pela loja parceira</span>
          </div>
          ${p.descricao ? `<div><div class="desc-titulo">Descrição</div><p class="desc">${p.descricao}</p></div>` : ""}
        </div>
      </div>
    `;

    montarZoom(fotoInicial);
  }

  iniciar();
</script>

</body>
</html>
