backend:
  name: github
  repo: weillergreg/achados-ofertas-site
  branch: main
  base_url: https://achadosofertas.com.br
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "banners"
    label: "Banner Principal (Home)"
    folder: "_banners"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    identifier_field: "titulo_interno"
    fields:
      - { label: "Nome interno (só pra você identificar na lista, ex: Black Friday Julho)", name: "titulo_interno", widget: "string" }
      - { label: "Slug (só letras/números/traço, ex: banner-black-friday)", name: "slug", widget: "string" }
      - { label: "Imagem do banner (tamanho ideal: 1200x500px, até 300kb)", name: "imagem", widget: "image", hint: "Tamanho ideal: 1200x500px (retangular). O site ajusta sozinho pro celular." }
      - { label: "Link ao clicar na imagem (cole a URL da página, existente ou futura)", name: "link", widget: "string" }
      - { label: "Ordem de exibição (1, 2, 3...)", name: "ordem", widget: "number", value_type: "int", default: 1 }
      - label: "Botão de texto sobre o banner (opcional)"
        name: "botao"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Texto do botão", name: "texto", widget: "string", required: false }
          - { label: "Cor do botão (ex: #22C55E)", name: "cor", widget: "string", required: false, default: "#22C55E" }
          - { label: "Link do botão (se for diferente do link da imagem)", name: "link_botao", widget: "string", required: false }

  - name: "lote_shopee"
    label: "Produtos Importados (Shopee)"
    files:
      - name: "lote"
        label: "Lote de Produtos Shopee"
        file: "_data/lote-shopee.json"
        fields:
          - name: "produtos"
            label: "Produtos"
            widget: "list"
            summary: "{{title}} — {{categoria}}"
            fields:
              - { label: "Nome do Produto", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Categoria (slug)", name: "categoria", widget: "string", hint: "moda-e-vestuario, eletronicos, calcados, beleza-e-cuidados-pessoais, eletrodomesticos, fitness ou ferramentas" }
              - { label: "Subcategoria", name: "subcategoria", widget: "string", required: false }
              - label: "Fotos"
                name: "fotos"
                widget: "list"
                required: false
                fields:
                  - { label: "URL da foto", name: "foto", widget: "string" }
              - { label: "Preço", name: "preco", widget: "string", required: false }
              - { label: "Formas de pagamento", name: "pagamento", widget: "string", required: false }
              - { label: "Link (⚠️ confirme se é seu link de afiliado antes de divulgar)", name: "link", widget: "string" }
              - { label: "Nota", name: "nota", widget: "string", required: false }
              - { label: "Avaliações/curtidas", name: "avaliacoes", widget: "string", required: false }
              - { label: "Vendidos", name: "vendidos", widget: "string", required: false }
              - { label: "Descrição", name: "descricao", widget: "text", required: false }
              - { label: "Posição no Top 100", name: "posicao_top100", widget: "number", required: false, value_type: "int", min: 1, max: 100 }

  - name: "categorias"
    label: "Categorias"
    folder: "_categorias"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    identifier_field: "nome"
    fields:
      - { label: "Nome da Categoria", name: "nome", widget: "string" }
      - { label: "Slug (parte da URL, ex: moda-e-vestuario)", name: "slug", widget: "string" }

  - name: "subcategorias"
    label: "Subcategorias"
    folder: "_subcategorias"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    identifier_field: "nome"
    fields:
      - { label: "Nome da Subcategoria (inclua a categoria mãe, ex: Eletrônicos > Fone de Ouvido)", name: "nome", widget: "string" }
      - { label: "Slug (parte da URL, ex: fone-de-ouvido)", name: "slug", widget: "string" }
      - label: "Categoria Mãe"
        name: "categoria_mae"
        widget: "relation"
        collection: "categorias"
        search_fields: ["nome"]
        display_fields: ["nome"]
        value_field: "slug"

  - name: "produtos"
    label: "Produtos"
    folder: "_produtos"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Nome do Produto", name: "title", widget: "string" }
      - { label: "Slug (parte da URL, sem espaço/acento, ex: copo-termico-super-pai)", name: "slug", widget: "string" }
      - label: "Categoria"
        name: "categoria"
        widget: "relation"
        collection: "categorias"
        search_fields: ["nome"]
        display_fields: ["nome"]
        value_field: "slug"
      - label: "Subcategoria"
        name: "subcategoria"
        widget: "relation"
        collection: "subcategorias"
        search_fields: ["nome"]
        display_fields: ["nome"]
        value_field: "slug"
        required: false
      - label: "Fotos do produto (até 5)"
        name: "fotos"
        widget: "list"
        max: 5
        field: { label: "Foto", name: "foto", widget: "image" }
      - { label: "Preço (ex: 89,90)", name: "preco", widget: "string" }
      - { label: "Formas de pagamento (ex: Pix, cartão em 12x)", name: "pagamento", widget: "string", required: false }
      - { label: "Link de afiliado (botão Compre Aqui)", name: "link", widget: "string" }
      - { label: "Nota de avaliação (ex: 4.8)", name: "nota", widget: "string", required: false }
      - { label: "Número de avaliações (ex: 419)", name: "avaliacoes", widget: "string", required: false }
      - { label: "Quantidade vendida (ex: +1 mil vendidos)", name: "vendidos", widget: "string", required: false }
      - { label: "Descrição do produto", name: "descricao", widget: "text" }
      - { label: "Posição no Top 100 (1 a 100, deixe em branco se não for um dos mais vendidos)", name: "posicao_top100", widget: "number", required: false, value_type: "int", min: 1, max: 100 }

  - name: "posts"
    label: "Blog - Notícias"
    folder: "_posts"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Título do Post", name: "title", widget: "string" }
      - { label: "Slug (parte da URL, ex: presentes-dia-das-maes-2026)", name: "slug", widget: "string" }
      - { label: "Foto de Capa (formato 16:9)", name: "capa", widget: "image" }
      - { label: "Descrição para o Google (SEO)", name: "description", widget: "text" }
      - { label: "Texto do Post", name: "body", widget: "markdown" }
      - { label: "Data de publicação", name: "date", widget: "datetime" }
      - label: "Produtos deste post (busque pelo nome, até 10)"
        name: "produtos"
        widget: "relation"
        collection: "produtos"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "slug"
        multiple: true
        min: 0
        max: 10
        required: false
