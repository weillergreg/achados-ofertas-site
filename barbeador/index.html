<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3;url=https://meli.la/257dQGe">
<title>Redirecionando... | Achadinhos Super Espiã</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#1B3A6B; --dourado:#D9A441; --rosa:#FF3E8E; --verde:#22C55E;
    --bg:#FAFAFA; --text:#1F2430; --text-muted:#6B7280;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; text-align:center; padding:24px;
  }
  .card{ max-width:360px; }
  .spinner{
    width:56px; height:56px; margin:0 auto 24px;
    border:5px solid #ECECEC; border-top-color:var(--dourado);
    border-radius:50%; animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{ font-family:'Poppins',sans-serif; font-size:19px; color:var(--azul); margin:0 0 10px; }
  p.tip{ font-size:14px; color:var(--text-muted); margin:0 0 22px; }
  a.manual{
    display:inline-block; background:var(--verde); color:#fff; text-decoration:none;
    font-weight:700; font-size:13px; padding:11px 22px; border-radius:999px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecionando para a loja...</h1>
    <p class="tip">Você será levado até o Mercado Livre em instantes. Não feche esta aba.</p>
    <a class="manual" href="https://meli.la/257dQGe">Clique aqui se não for redirecionado</a>
  </div>
  <script>
    setTimeout(function(){ window.location.href = "https://meli.la/257dQGe"; }, 2500);
  </script>
</body>
</html>
